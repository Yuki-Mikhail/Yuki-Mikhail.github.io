<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>二项分布交互可视化（扔硬币模拟）</title>
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* 二项分布是离散分布，用柱状图更合适 */
        .bar-chart {
            position: relative;
        }
    </style>
</head>
<body>
    <h1 class="title">二项分布（Binomial）</h1>

    <div class="toggle-panel">
        <span class="toggle-label">显示类型：</span>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="funcType" value="pmf" checked onchange="redrawAll()"> 概率质量函数 (PMF)</label>
            <label class="radio-item"><input type="radio" name="funcType" value="cdf" onchange="redrawAll()"> 分布函数 (CDF)</label>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-left">
            <div class="control-group">
                <span class="control-label">试验次数 n：</span>
                <button class="param-btn" onclick="changeN(-1)">- 1</button>
                <span id="nValue" class="param-display">10</span>
                <button class="param-btn" onclick="changeN(1)">+ 1</button>
            </div>
            <div class="control-group">
                <span class="control-label">成功概率 p：</span>
                <button class="param-btn" onclick="changeP(-0.1)">- 0.1</button>
                <span id="pValue" class="param-display">0.5</span>
                <button class="param-btn" onclick="changeP(0.1)">+ 0.1</button>
            </div>
        </div>
        <div class="control-right">
            <div class="formula-title">当前分布公式</div>
            <div class="formula-box" id="formulaDisplay"></div>
        </div>
    </div>

    <div class="canvas-container bar-chart">
        <div id="tooltip"></div>
        <canvas id="distributionCanvas" width="800" height="400"></canvas>
    </div>

    <div class="relation-panel">
        <h3 class="relation-title">🎲 二项分布与扔硬币模拟</h3>
        <p class="relation-desc">
            1. <strong>经典例子：扔硬币</strong><br>
            &nbsp;&nbsp;&nbsp;• n = 扔硬币的次数<br>
            &nbsp;&nbsp;&nbsp;• p = 正面朝上的概率<br>
            &nbsp;&nbsp;&nbsp;• X = 正面朝上的次数<br>
            2. PMF(k) = P(X=k) = C(n,k) p^k (1-p)^(n-k)<br>
            3. n很大时→近似正态分布（中心极限定理）<br>
            4. p=0.5时→分布对称
        </p>
        <div class="link-group">
            <a href="normal.html">正态分布
        </div>
    </div>

    <script>
        const canvas=document.getElementById('distributionCanvas'),ctx=canvas.getContext('2d'),tooltip=document.getElementById('tooltip'),formulaDisplay=document.getElementById('formulaDisplay');
        let n=10,p=0.5,hoverPoint=null; const w=800,h=400,pad=50,xMin=-0.5,xMax=n+0.5;
        function getType(){return document.querySelector('input[name="funcType"]:checked').value;}
        
        // ✅ 高精度对数伽马函数（用于计算组合数）
        function logGamma(z) {
            const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
            if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-logGamma(1-z);
            z--;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);
            const t=z+g+0.5;
            return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
        }
        
        // ✅ 组合数 C(n,k) = n!/(k!(n-k)!)
        function comb(nn, kk) {
            if(kk<0||kk>nn)return 0;
            if(kk===0||kk===nn)return 1;
            return Math.exp(logGamma(nn+1)-logGamma(kk+1)-logGamma(nn-kk+1));
        }
        
        // ✅ 二项分布PMF：P(X=k) = C(n,k) p^k (1-p)^(n-k)
        function binomPMF(k) {
            if(k<0||k>n||k!==Math.floor(k))return 0;
            const c=comb(n,k);
            return c*Math.pow(p,k)*Math.pow(1-p,n-k);
        }
        
        // ✅ 二项分布CDF：P(X≤k) = Σ_{i=0}^k PMF(i)
        function binomCDF(k) {
            if(k<0)return 0;
            if(k>=n)return 1;
            let sum=0;
            for(let i=0;i<=Math.floor(k);i++)sum+=binomPMF(i);
            return sum;
        }
        
        function getY(k){return getType()==='pmf'?binomPMF(k):binomCDF(k);}
        
        function updateFormula(){const nn=n,pp=p.toFixed(1);if(getType()==='pmf')formulaDisplay.innerHTML=`\\( P(X=k) = \\binom{${nn}}{k} ${pp}^k (1-${pp})^{${nn}-k} \\)`;else formulaDisplay.innerHTML=`\\( P(X\\leq k) = \\sum_{i=0}^{\\lfloor k \\rfloor} \\binom{${nn}}{i} ${pp}^i (1-${pp})^{${nn}-i} \\)`;if(window.MathJax)MathJax.typesetPromise([formulaDisplay]);}
        function changeN(d){const nn=n+d;if(nn>=1&&nn<=50){n=nn;document.getElementById('nValue').textContent=n;redrawAll();}}
        function changeP(d){const pp=p+d;if(pp>=0.1&&pp<=0.9){p=pp;document.getElementById('pValue').textContent=p.toFixed(1);redrawAll();}}
        function mapX(x){const xMaxVal=n+0.5;return pad+(x-xMin)/(xMaxVal-xMin)*(w-2*pad);}
        function mapY(y,maxY){const val=h-pad-(y/maxY)*(h-2*pad);return Math.max(pad,Math.min(h-pad,val));}
        
        function drawAxes(){
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle='#cbd5e0';ctx.lineWidth=1;
            for(let y=pad;y<=h-pad;y+=40){ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
            for(let x=pad;x<=w-pad;x+=40){ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();}
            ctx.strokeStyle='#2d3748';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();
            ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,h-pad);ctx.stroke();
            ctx.fillStyle='#333';ctx.font='12px Arial';ctx.textAlign='center';
            for(let k=0;k<=n;k+=Math.max(1,Math.floor(n/10))){ctx.fillText(k,mapX(k),h-pad+15);}
            ctx.textAlign='right';
            for(let i=0;i<=1;i+=0.2)ctx.fillText(i.toFixed(1),pad-8,mapY(i,1)+4);
        }
        
        function redrawAll(){
            updateFormula();drawAxes();
            const isPmf=getType()==='pmf';
            let maxY=1;
            if(isPmf){maxY=0;for(let k=0;k<=n;k++)maxY=Math.max(maxY,binomPMF(k));maxY*=1.1;}
            
            // ✅ 二项分布是离散的，画柱状图
            ctx.fillStyle='#4299e1';
            const barWidth=Math.max(2,(w-2*pad)/(n+1)-2);
            for(let k=0;k<=n;k++){
                const y=getY(k);
                const cx=mapX(k);
                const cy=mapY(y,maxY);
                const barX=cx-barWidth/2;
                const barH=h-pad-cy;
                ctx.fillRect(barX,cy,barWidth,barH);
            }
            
            // 悬浮点
            if(hoverPoint){
                const {k}=hoverPoint;
                const y=getY(k);
                const cx=mapX(k);
                const cy=mapY(y,maxY);
                ctx.fillStyle='#ff5050';
                ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();
            }
        }
        
        canvas.addEventListener('mousemove',e=>{
            const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
            if(mx>=pad&&mx<=w-pad&&my>=pad&&my<=h-pad){
                const xMaxVal=n+0.5;
                const x=xMin+(mx-pad)/(w-2*pad)*(xMaxVal-xMin);
                const k=Math.round(x);
                if(k>=0&&k<=n){
                    const y=getY(k);
                    hoverPoint={k,y};
                    tooltip.style.display='block';
                    tooltip.style.left=mx+12+'px';
                    tooltip.style.top=my-24+'px';
                    tooltip.textContent=`k=${k}  Y=${y.toFixed(4)}`;
                }else{hoverPoint=null;tooltip.style.display='none';}
            }else{hoverPoint=null;tooltip.style.display='none';}
            redrawAll();
        });
        canvas.addEventListener('mouseleave',()=>{hoverPoint=null;tooltip.style.display='none';redrawAll();});
        window.addEventListener('load',redrawAll);
    </script>
</body>
</html>
