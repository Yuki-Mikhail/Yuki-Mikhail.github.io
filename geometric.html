<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>几何分布交互可视化</title>
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <h1 class="title">几何分布（Geometric）</h1>

    <div class="toggle-panel">
        <span class="toggle-label">显示类型：</span>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="funcType" value="pmf" checked onchange="redrawAll()"> 概率质量函数 (PMF)</label>
            <label class="radio-item"><input type="radio" name="funcType" value="cdf" onchange="redrawAll()"> 分布函数 (CDF)</label>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-left">
            <div class="control-group">
                <span class="control-label">成功概率 p：</span>
                <button class="param-btn" onclick="changeP(-0.1)">- 0.1</button>
                <span id="pValue" class="param-display">0.5</span>
                <button class="param-btn" onclick="changeP(0.1)">+ 0.1</button>
            </div>
        </div>
        <div class="control-right">
            <div class="formula-title">当前分布公式</div>
            <div class="formula-box" id="formulaDisplay"></div>
        </div>
    </div>

    <div class="canvas-container">
        <div id="tooltip"></div>
        <canvas id="distributionCanvas" width="800" height="400"></canvas>
    </div>

    <div class="relation-panel">
        <h3 class="relation-title">🎯 几何分布与常见统计分布的关系</h3>
        <p class="relation-desc">
            1. <strong>经典定义：首次成功的试验次数</strong><br>
            &nbsp;&nbsp;&nbsp;• 扔硬币首次正面、投篮首次命中<br>
            2. 具有<strong>无记忆性</strong>：P(X>m+n | X>m) = P(X>n)<br>
            3. 是负二项分布的特例（r=1）<br>
            4. 离散版"指数分布"，描述等待时间
        </p>
        <div class="link-group">
            <a href="exponential.html">指数分布</a><a href="negative_binomial.html">负二项分布</a>
        </div>
    </div>

    <script>
        const canvas=document.getElementById('distributionCanvas'),ctx=canvas.getContext('2d'),tooltip=document.getElementById('tooltip'),formulaDisplay=document.getElementById('formulaDisplay');
        let p=0.5,hoverPoint=null; const w=800,h=400,pad=50,xMin=0.5;
        function getType(){return document.querySelector('input[name="funcType"]:checked').value;}
        
        // 几何分布PMF：P(X=k) = (1-p)^(k-1) * p  (k=1,2,3,...)
        // 表示首次成功发生在第k次试验的概率
        function geomPMF(k) {
            if(k<1||k!==Math.floor(k))return 0;
            return Math.pow(1-p, k-1) * p;
        }
        
        // 几何分布CDF：P(X≤k) = 1 - (1-p)^k
        function geomCDF(k) {
            if(k<1)return 0;
            return 1 - Math.pow(1-p, Math.floor(k));
        }
        
        function getY(k){return getType()==='pmf'?geomPMF(k):geomCDF(k);}
        
        function updateFormula(){const pp=p.toFixed(1);if(getType()==='pmf')formulaDisplay.innerHTML=`\\( P(X=k) = (1-${pp})^{k-1} \\cdot ${pp} \\quad (k=1,2,3,\\dots) \\)`;else formulaDisplay.innerHTML=`\\( P(X\\leq k) = 1 - (1-${pp})^k \\)`;if(window.MathJax)MathJax.typesetPromise([formulaDisplay]);}
        function changeP(d){const np=p+d;if(np>=0.1&&np<=0.9){p=np;document.getElementById('pValue').textContent=p.toFixed(1);redrawAll();}}
        function mapX(x, xMaxVal){return pad+(x-xMin)/(xMaxVal-xMin)*(w-2*pad);}
        function mapY(y,maxY){const val=h-pad-(y/maxY)*(h-2*pad);return Math.max(pad,Math.min(h-pad,val));}
        
        function drawAxes(xMaxVal){
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle='#cbd5e0';ctx.lineWidth=1;
            for(let y=pad;y<=h-pad;y+=40){ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
            for(let x=pad;x<=w-pad;x+=40){ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();}
            ctx.strokeStyle='#2d3748';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();
            ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,h-pad);ctx.stroke();
            ctx.fillStyle='#333';ctx.font='12px Arial';ctx.textAlign='center';
            // 动态调整X轴刻度
            const step=Math.max(1,Math.floor(xMaxVal/10));
            for(let k=1;k<=xMaxVal;k+=step){ctx.fillText(k,mapX(k,xMaxVal),h-pad+15);}
            ctx.textAlign='right';
            for(let i=0;i<=1;i+=0.2)ctx.fillText(i.toFixed(1),pad-8,mapY(i,1)+4);
        }
        
        function redrawAll(){
            // 动态确定X轴范围：覆盖到概率累积到99.9%的位置
            const xMaxVal=Math.max(Math.ceil(Math.log(0.001)/Math.log(1-p)),10);
            updateFormula();
            drawAxes(xMaxVal);
            
            const isPmf=getType()==='pmf';
            let maxY=1;
            if(isPmf){
                // 几何分布PMF最大值在k=1处，值为p
                maxY=p*1.1;
            }
            
            // ✅ 离散分布画柱状图
            ctx.fillStyle='#4299e1';
            const barWidth=Math.max(2,(w-2*pad)/(xMaxVal+1)-2);
            for(let k=1;k<=xMaxVal;k++){
                const y=getY(k);
                const cx=mapX(k,xMaxVal);
                const cy=mapY(y,maxY);
                const barX=cx-barWidth/2;
                const barH=h-pad-cy;
                ctx.fillRect(barX,cy,barWidth,barH);
            }
            
            // 悬浮点
            if(hoverPoint){
                const {k}=hoverPoint;
                if(k>=1&&k<=xMaxVal){
                    const y=getY(k);
                    const cx=mapX(k,xMaxVal);
                    const cy=mapY(y,maxY);
                    ctx.fillStyle='#ff5050';
                    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();
                }
            }
        }
        
        canvas.addEventListener('mousemove',e=>{
            const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
            if(mx>=pad&&mx<=w-pad&&my>=pad&&my<=h-pad){
                const xMaxVal=Math.max(Math.ceil(Math.log(0.001)/Math.log(1-p)),10);
                const x=xMin+(mx-pad)/(w-2*pad)*(xMaxVal-xMin);
                const k=Math.round(x);
                if(k>=1&&k<=xMaxVal){
                    const y=getY(k);
                    hoverPoint={k,y};
                    tooltip.style.display='block';
                    tooltip.style.left=mx+12+'px';
                    tooltip.style.top=my-24+'px';
                    tooltip.textContent=`k=${k}  Y=${y.toFixed(4)}`;
                }else{hoverPoint=null;tooltip.style.display='none';}
            }else{hoverPoint=null;tooltip.style.display='none';}
            redrawAll();
        });
        canvas.addEventListener('mouseleave',()=>{hoverPoint=null;tooltip.style.display='none';redrawAll();});
        window.addEventListener('load',redrawAll);
    </script>
</body>
</html>
