<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>t分布交互可视化</title>
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <h1 class="title">t 分布（Student's t）</h1>

    <div class="toggle-panel">
        <span class="toggle-label">显示类型：</span>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="funcType" value="pdf" checked onchange="redrawAll()"> 概率密度函数 (PDF)</label>
            <label class="radio-item"><input type="radio" name="funcType" value="cdf" onchange="redrawAll()"> 分布函数 (CDF)</label>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-left">
            <div class="control-group">
                <span class="control-label">自由度 df：</span>
                <button class="param-btn" onclick="changeDf(-1)">- 1</button>
                <span id="dfValue" class="param-display">5</span>
                <button class="param-btn" onclick="changeDf(1)">+ 1</button>
            </div>
        </div>
        <div class="control-right">
            <div class="formula-title">当前分布公式</div>
            <div class="formula-box" id="formulaDisplay"></div>
        </div>
    </div>

    <div class="canvas-container"><div id="tooltip"></div><canvas id="distributionCanvas" width="800" height="400"></canvas></div>

    <div class="relation-panel">
        <h3 class="relation-title">📊 t分布与常见统计分布的关系</h3>
        <p class="relation-desc">1. t 分布为对称偶函数，\(F(0)=0.5\)<br>2. 自由度越大，越趋近标准正态分布<br>3. \(t^2 \sim F(1,df)\)<br>4. 常用于小样本均值假设检验</p>
        <div class="link-group">
            <a href="normal.html">正态</a>
        </div>
    </div>

    <script>
        const canvas=document.getElementById('distributionCanvas'),ctx=canvas.getContext('2d'),tooltip=document.getElementById('tooltip'),formulaDisplay=document.getElementById('formulaDisplay');
        let df=5,hoverPoint=null; const w=800,h=400,pad=50,xMin=-5,xMax=5;
        function getType(){return document.querySelector('input[name="funcType"]:checked').value;}
        
        // 高精度伽马函数
        function gamma(z) {
            const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
            if(z<0.5)return Math.PI/(Math.sin(Math.PI*z)*gamma(1-z));
            z-=1;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);
            const t=z+g+0.5;
            return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x;
        }
        
        function tPDF(x) {
            const v=df;
            const numer=gamma((v+1)/2);
            const denom=Math.sqrt(v*Math.PI)*gamma(v/2);
            return numer/denom*Math.pow(1+x*x/v,-(v+1)/2);
        }
        
        // t分布CDF（利用对称性+高精度数值积分）
        function integrate(a,b,step=0.005) {
            let s=0;
            for(let x=a;x<b;x+=step)s+=tPDF(x)*step;
            return s;
        }
        function tCDF(x) {
            if(x===0)return 0.5;
            if(x>0)return Math.min(1,0.5+integrate(0,x));
            else return Math.max(0,0.5-integrate(x,0));
        }
        
        function getY(x){return getType()==='pdf'?tPDF(x):tCDF(x);}
        
        function updateFormula(){const v=df;if(getType()==="pdf")formulaDisplay.innerHTML=`\\( f(x) = \\dfrac{\\Gamma\\left(\\frac{${v}+1}{2}\\right)}{\\sqrt{${v}\\pi}\\,\\Gamma\\left(\\frac{${v}}{2}\\right)} \\left(1+\\dfrac{x^2}{${v}}\\right)^{-\\frac{${v}+1}{2}} \\)`;else formulaDisplay.innerHTML=`\\( F(x) = \\int_{-\\infty}^{x} f(t)\\mathrm{d}t,\\quad F(0)=0.5 \\)`;if(window.MathJax)MathJax.typesetPromise([formulaDisplay]);}
        function changeDf(delta){const nd=df+delta;if(nd>=1&&nd<=30){df=nd;document.getElementById('dfValue').textContent=df;redrawAll();}}
        function mapX(x){return pad+(x-xMin)/(xMax-xMin)*(w-2*pad);}
        function mapY(y,maxY){const val=h-pad-(y/maxY)*(h-2*pad);return Math.max(pad,Math.min(h-pad,val));}
        
        function drawAxes(){
            ctx.clearRect(0,0,w,h);
            ctx.strokeStyle='#cbd5e0';ctx.lineWidth=1;
            for(let y=pad;y<=h-pad;y+=40){ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
            for(let x=pad;x<=w-pad;x+=40){ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();}
            ctx.strokeStyle='#2d3748';ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();
            ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,h-pad);ctx.stroke();
            const x0=mapX(0);ctx.strokeStyle='#ff7070';ctx.setLineDash([5,3]);
            ctx.beginPath();ctx.moveTo(x0,pad);ctx.lineTo(x0,h-pad);ctx.stroke();ctx.setLineDash([]);
            ctx.fillStyle='#333';ctx.font='12px Arial';ctx.textAlign='center';
            for(let x=-4;x<=4;x+=2)ctx.fillText(x,mapX(x),h-pad+15);
            ctx.textAlign='right';
            for(let i=0;i<=1;i+=0.2)ctx.fillText(i.toFixed(1),pad-8,mapY(i,1)+4);
        }
        
        function redrawAll(){
            updateFormula();drawAxes();
            const isPdf=getType()==="pdf";
            const maxY=isPdf?tPDF(0)*1.1:1.0;
            ctx.strokeStyle='#4299e1';ctx.lineWidth=3;ctx.beginPath();
            for(let px=0;px<w;px++){
                const x=xMin+px/w*(xMax-xMin),y=getY(x),cx=mapX(x),cy=mapY(y,maxY);
                px===0?ctx.moveTo(cx,cy):ctx.lineTo(cx,cy);
            }
            ctx.stroke();
            if(hoverPoint){const {x}=hoverPoint,y=getY(x);ctx.fillStyle='#ff5050';ctx.beginPath();ctx.arc(mapX(x),mapY(y,maxY),5,0,Math.PI*2);ctx.fill();}
        }
        
        canvas.addEventListener('mousemove',e=>{
            const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
            if(mx>=pad&&mx<=w-pad&&my>=pad&&my<=h-pad){
                const x=xMin+(mx-pad)/(w-2*pad)*(xMax-xMin),y=getY(x);
                hoverPoint={x,y};
                tooltip.style.display='block';
                tooltip.style.left=mx+12+'px';
                tooltip.style.top=my-24+'px';
                tooltip.textContent=`X=${x.toFixed(2)}  Y=${y.toFixed(4)}`;
            }else{hoverPoint=null;tooltip.style.display='none';}
            redrawAll();
        });
        canvas.addEventListener('mouseleave',()=>{hoverPoint=null;tooltip.style.display='none';redrawAll();});
        window.addEventListener('load',redrawAll);
    </script>
</body>
</html>
